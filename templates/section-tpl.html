<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ section_seo_title }}</title>
    <meta name="description" content="{{ section_description }}">
    <meta name="keywords" content="{{ section_keywords }}">
    <meta name="author" content="{{ SEO_AUTHOR }}">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="theme-color" content="#0f0c29">
    <meta name="format-detection" content="telephone=no">
    <link rel="canonical" href="{{ SEO_DOMAIN }}sections/{{ section_filename }}">
    <link rel="alternate" hreflang="zh-CN" href="{{ SEO_DOMAIN }}sections/{{ section_filename }}">
    <link rel="alternate" hreflang="x-default" href="{{ SEO_DOMAIN }}sections/{{ section_filename }}">
    <link rel="preconnect" href="https://img.shields.io">
    <meta property="og:title" content="{{ section_seo_title }}">
    <meta property="og:description" content="{{ section_description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ SEO_DOMAIN }}sections/{{ section_filename }}">
    <meta property="og:image" content="{{ SEO_IMAGE }}">
    <meta property="og:image:alt" content="{{ section_title }} - {{ SEO_SITE_NAME }}封面图">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="{{ SEO_SITE_NAME }}">
    <meta property="og:locale" content="{{ SEO_LOCALE }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ section_seo_title }}">
    <meta name="twitter:description" content="{{ section_description }}">
    <meta name="twitter:image" content="{{ SEO_IMAGE }}">
    <meta name="twitter:image:alt" content="{{ section_title }} - {{ SEO_SITE_NAME }}封面图">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "CollectionPage",
          "@id": "{{ SEO_DOMAIN }}sections/{{ section_filename }}#webpage",
          "url": "{{ SEO_DOMAIN }}sections/{{ section_filename }}",
          "name": {{ section_seo_title | tojson }},
          "description": {{ section_description | tojson }},
          "isPartOf": { "@type": "WebSite", "@id": "{{ SEO_DOMAIN }}#website", "name": {{ SEO_SITE_NAME | tojson }}, "url": "{{ SEO_DOMAIN }}" },
          "primaryImageOfPage": { "@type": "ImageObject", "url": "{{ SEO_IMAGE }}" },
          "about": ["免费影视下载", "{{ section_title }}", "网盘资源", "中文字幕"],
          "inLanguage": "zh-CN"
        },
        {
          "@type": "ItemList",
          "@id": "{{ SEO_DOMAIN }}sections/{{ section_filename }}#itemlist",
          "name": {{ (section_title ~ '免费资源列表') | tojson }},
          "numberOfItems": {{ total_count }},
          "itemListElement": [
            {% for item in section_items_seo %}
            {
              "@type": "ListItem",
              "position": {{ loop.index }},
              "item": {
                "@type": "CreativeWork",
                "name": {{ item.name | tojson }},
                "description": {{ item.description | tojson }}
              }
            }{% if not loop.last %},{% endif %}
            {% endfor %}
          ]
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "首页", "item": "{{ SEO_DOMAIN }}" },
            { "@type": "ListItem", "position": 2, "name": {{ section_title | tojson }}, "item": "{{ SEO_DOMAIN }}sections/{{ section_filename }}" }
          ]
        }
      ]
    }
    </script>
    <link rel="icon" href="../docs/favicon.png" type="image/png">
    <link href="../docs/css/bootstrap.min.css" rel="stylesheet">
    <link href="../docs/css/style.css" rel="stylesheet">
    <script src="../docs/js/bootstrap.bundle.min.js"></script>
    <script src="../docs/js/cdn-config.js"></script>
    <script src="../docs/js/seo-meta.js" defer></script>
    <style>
        body {
            background: #0f0c29;
            color: #e0e0e0;
            padding-top: 60px;
        }
        /* ========== 顶部导航栏 ========== */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1030;
            background: rgba(15,12,41,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            height: 60px;
        }
        .top-nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }
        .nav-brand {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-brand:hover {
            opacity: 0.85;
        }
        .nav-links {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }
        .nav-link-btn {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all .2s;
            white-space: nowrap;
        }
        .nav-link-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .nav-link-btn.active {
            color: #ffd700;
            background: rgba(255,215,0,0.12);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: flex-end;
            min-width: 0;
        }
        .nav-search {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            max-width: 260px;
            width: 100%;
            transition: border-color .2s;
        }
        .nav-search:focus-within {
            border-color: rgba(255,215,0,0.4);
        }
        .nav-search input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 7px 14px;
            font-size: 0.8rem;
            width: 100%;
        }
        .nav-search input::placeholder {
            color: rgba(255,255,255,0.35);
        }
        .nav-search button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            padding: 7px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: color .2s;
        }
        .nav-search button:hover {
            color: #ffd700;
        }
        .nav-desc {
            color: rgba(255,255,255,0.4);
            font-size: 0.65rem;
            line-height: 1.3;
            text-align: right;
            display: none;
        }
        @media (min-width: 992px) {
            .nav-desc { display: block; }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .nav-search { max-width: 180px; }
            .nav-brand { font-size: 0.95rem; }
        }
        .section-header-bg {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 100%);
            border-radius: 16px;
            padding: 45px 35px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(48,43,99,0.3);
        }
        .section-header-bg::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,215,0,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }
        .section-header-bg::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,107,107,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .section-title-glow {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 2px 8px rgba(255,215,0,0.3));
        }
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 12px;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15) !important;
        }
        .card-img-wrapper {
            overflow: hidden;
        }
        .card-img-wrapper img {
            transition: transform 0.3s ease;
        }
        .card:hover .card-img-wrapper img {
            transform: scale(1.08);
        }
        .badge.bg-light {
            background: #f8f9fa !important;
        }
        .btn-sm.btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            border: none;
            font-size: 0.75rem;
            padding: 4px 12px;
        }
        .btn-sm.btn-outline-secondary {
            font-size: 0.75rem;
            padding: 4px 10px;
        }
        /* ===== 三行筛选导航 ===== */
        .filter-bar {
            position: sticky;
            top: 60px;
            z-index: 1020;
            background: rgba(15,12,41,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 8px 0;
            margin: 0 -12px 16px -12px;
            padding-left: 12px;
            padding-right: 12px;
        }
        .filter-bar-inner {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .filter-rows {
            flex: 1;
            min-width: 0;
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .filter-row:last-child {
            margin-bottom: 0;
        }
        .filter-label {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.4);
            width: 32px;
            flex-shrink: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .filter-btn {
            font-size: 0.78rem;
            padding: 3px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: transparent;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
            line-height: 1.6;
        }
        .filter-btn:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.06);
        }
        .filter-btn.active {
            color: #ffd700;
            border-color: #ffd700;
            background: rgba(255,215,0,0.12);
        }
        .genre-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(100,181,246,0.15);
            color: #64b5f6;
            border: 1px solid rgba(100,181,246,0.25);
        }
        /* ===== 卡片网格(CSS Grid, 避免flex display:none重排bug) ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            min-height: 200px;
        }
        .card-grid > .card-wrapper {
            min-width: 0;
        }
        @media (max-width: 991px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }
        /* ===== 字幕标签 truncate，避免撑宽卡片 ===== */
        .card-grid .subtitle-badge {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* ===== 卡片图片（自定 class 避免与 style.css .card-img 冲突） ===== */
        .card-grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            min-height: 180px;
        }
        /* 移动端 col-md-4 堆叠时，图片撑满全宽会极高，限制最大高度 */
        @media (max-width: 767px) {
            .card-grid-img {
                max-height: 240px;
            }
        }
        /* ===== 合集资源 CTA ===== */
        .heji-cta-wrapper {
            flex-shrink: 0;
            padding-top: 2px;
        }
        .heji-cta-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.0rem;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(255,215,0,0.25);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .heji-cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255,215,0,0.35);
        }
        .heji-cta-btn.active {
            background: linear-gradient(135deg, #555, #333);
            color: #ffd700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .heji-cta-btn.active:hover {
            transform: none;
        }
        .heji-cta-sub {
            font-size: 0.7rem;
            color: rgba(255,215,0,0.5);
            margin-top: 3px;
            text-align: right;
            white-space: nowrap;
        }
        .heji-badge {
            display: inline-block;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 0 7px;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-left: 2px;
        }
        .heji-cta-btn.active .heji-badge {
            background: rgba(255,215,0,0.15);
        }
        @media (max-width: 576px) {
            .filter-bar-inner {
                flex-direction: column;
            }
            .heji-cta-wrapper {
                width: 100%;
            }
            .heji-cta-btn {
                width: 100%;
                justify-content: center;
                font-size: 0.95rem;
                padding: 10px 16px;
            }
            .heji-cta-sub {
                text-align: center;
            }
        }
        @media (max-width: 768px) {
            .filter-bar {
                top: 56px;
                padding: 6px 8px;
                margin: 0 -8px 12px -8px;
            }
            .filter-label {
                display: none;
            }
            .filter-btn {
                font-size: 0.72rem;
                padding: 2px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 下载模态框 -->
    <div class="modal fade" id="downloadModal" tabindex="-1" aria-labelledby="downloadModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="downloadModalLabel">下载信息</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                  <div id="downloadInfo">
                      <div class="alert alert-info">
                          <p><strong>下载链接：</strong><a id="modalDownloadLink" href="#" target="_blank">[点我下载]</a></p>
                          <p class="d-flex justify-content-between align-items-center">
                              <span><strong>提取码：</strong><span id="modalExtractCode"></span></span>
                              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('modalExtractCode', event)">复制</button>
                          </p>
                          <p class="d-flex justify-content-between align-items-center">
                              <span><strong>解压密码：</strong><span id="modalUUID"></span></span>
                              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('modalUUID', event)">复制</button>
                          </p>
                      </div>
                  </div>
              </div>
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
              </div>
          </div>
      </div>
    </div>

    <!-- 顶部导航栏 -->
    <nav class="top-nav">
        <div class="container">
            <div class="nav-left">
                <a href="../index.html" class="nav-brand">{{ SITE_TITLE }}</a>
                <div class="nav-links">
                    <a href="../index.html" class="nav-link-btn">首页</a>
                    <a href="section-01.html" class="nav-link-btn{% if section_number == 1 %} active{% endif %}">电视剧</a>
                    <a href="section-02.html" class="nav-link-btn{% if section_number == 2 %} active{% endif %}">电影</a>
                    <a href="section-03.html" class="nav-link-btn{% if section_number == 3 %} active{% endif %}">动漫</a>
                </div>
            </div>
            <div class="nav-right">
                <div class="nav-search">
                    <input type="text" id="globalSearchInput" placeholder="搜索电影/剧集..." aria-label="搜索">
                    <button type="button" id="globalSearchBtn">🔍</button>
                </div>
                <span class="nav-desc">电视剧 / 电影 / 动漫资源免费下载<br>夸克网盘、百度网盘链接失效可加QQ 753738153处理</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Section Header -->
        <div class="section-header-bg">
            <div class="position-relative" style="z-index: 1;">
                <div class="d-flex align-items-center gap-3 mb-1">
                    <h1 class="section-title-glow mb-0">{{ section_title }}</h1>
                    <span class="badge bg-warning text-dark fs-6 px-3 py-2 rounded-pill">免费下载</span>
                </div>
                <p class="text-white-50 mb-0 fs-6" style="letter-spacing:0.5px;">共 {{ total_count }} 部 · 免费网盘资源 · 按添加时间从新到旧</p>
            </div>
        </div>

        <!-- 三行筛选导航 + 合集资源 CTA -->
        <div class="filter-bar" id="filterBar">
            <div class="filter-bar-inner">
                <div class="filter-rows">
                    <div class="filter-row" id="filterRow1">
                        <span class="filter-label">地区</span>
                        <button class="filter-btn active" data-row="1" data-value="all" onclick="filterCards(event, 1, 'all')">全部</button>
                        <button class="filter-btn" data-row="1" data-value="大陆" onclick="filterCards(event, 1, '大陆')">大陆</button>
                        <button class="filter-btn" data-row="1" data-value="港台" onclick="filterCards(event, 1, '港台')">港台</button>
                        <button class="filter-btn" data-row="1" data-value="日本" onclick="filterCards(event, 1, '日本')">日本</button>
                        <button class="filter-btn" data-row="1" data-value="欧美" onclick="filterCards(event, 1, '欧美')">欧美</button>
                        <button class="filter-btn" data-row="1" data-value="韩国" onclick="filterCards(event, 1, '韩国')">韩国</button>
                    </div>
                    <div class="filter-row" id="filterRow2">
                        <span class="filter-label">类型</span>
                        <button class="filter-btn active" data-row="2" data-value="all" onclick="filterCards(event, 2, 'all')">全部</button>
                        {% for g in genres %}
                        <button class="filter-btn" data-row="2" data-value="{{ g }}" onclick="filterCards(event, 2, '{{ g }}')">{{ g }}</button>
                        {% endfor %}
                    </div>
                    <div class="filter-row" id="filterRow3">
                        <span class="filter-label">语言</span>
                        <button class="filter-btn active" data-row="3" data-value="all" onclick="filterCards(event, 3, 'all')">全部</button>
                        <button class="filter-btn" data-row="3" data-value="国语" onclick="filterCards(event, 3, '国语')">国语</button>
                        <button class="filter-btn" data-row="3" data-value="粤语" onclick="filterCards(event, 3, '粤语')">粤语</button>
                        <button class="filter-btn" data-row="3" data-value="日语" onclick="filterCards(event, 3, '日语')">日语</button>
                        <button class="filter-btn" data-row="3" data-value="英语" onclick="filterCards(event, 3, '英语')">英语</button>
                        <button class="filter-btn" data-row="3" data-value="韩语" onclick="filterCards(event, 3, '韩语')">韩语</button>
                    </div>
                </div>
                <div class="heji-cta-wrapper">
                    <button class="heji-cta-btn" onclick="toggleHejiFilter()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-2px;margin-right:4px;"><path d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1H.5zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM2.31 4l1.191 4H12.3l1.2-4H2.31z"/></svg>
                        只看【合集】资源 <span class="heji-badge" id="hejiCountBadge">{{ heji_count }}</span>
                    </button>
                    <div class="heji-cta-sub">不用挨个找，一次免费下载全系列，合集资源更省心</div>
                </div>
            </div>
        </div>

        <!-- 卡片网格 -->
        <div class="card-grid" id="cardGrid">
            {{ section_content }}
        </div>
    </div>

    <button id="backToTop" class="back-to-top" onclick="scrollToTop()" title="回到顶部">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
        </svg>
    </button>

    <!-- 目录模态框 -->
    <div class="modal fade" id="collectionDirModal" tabindex="-1" aria-labelledby="collectionDirModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="background:#1a1a2e;color:#e0e0e0;border:1px solid rgba(255,255,255,0.1);">
          <div class="modal-header" style="border-bottom:1px solid rgba(255,255,255,0.08);">
            <h5 class="modal-title" id="collectionDirModalLabel" style="color:#ffd700;">目录</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="collectionDirModalBody">
            <div class="text-center text-muted py-4"><p>加载中...</p></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="searchModalLabel">搜索结果</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body" id="searchResults">
                  <div class="text-center text-muted"><p>正在搜索...</p></div>
              </div>
          </div>
      </div>
    </div>

    <script>
    var activeFilter = { row: 0, value: 'all' };
    function filterCards(event, row, value) {
      var btn = event.target;
      document.querySelectorAll('.filter-btn.active').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeFilter = { row: row, value: value };
      // Deactivate heji filter when any normal filter is clicked
      document.querySelector('.heji-cta-btn').classList.remove('active');
      applyFilter();
    }
    function applyFilter() {
      var r = activeFilter.row, v = activeFilter.value;
      var attrs = { 1: 'region', 2: 'genre', 3: 'lang' };
      var cards = document.querySelectorAll('.card-wrapper');
      if (v === 'all') {
        cards.forEach(function(c) { c.style.display = ''; });
        return;
      }
      var attr = attrs[r];
      cards.forEach(function(c) {
        var val = (c.getAttribute('data-' + attr) || '').toLowerCase();
        if (v === '港台' && attr === 'region') {
          c.style.display = (val === '香港' || val === '台湾') ? '' : 'none';
        } else {
          c.style.display = val.indexOf(v.toLowerCase()) >= 0 ? '' : 'none';
        }
      });
    }
    function toggleHejiFilter() {
      var btn = document.querySelector('.heji-cta-btn');
      var isActive = btn.classList.toggle('active');
      var cards = document.querySelectorAll('.card-wrapper');
      // Reset normal filter buttons
      document.querySelectorAll('.filter-btn.active').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.filter-btn[data-value="all"]').forEach(function(b) { b.classList.add('active'); });
      activeFilter = { row: 0, value: 'all' };
      if (isActive) {
        cards.forEach(function(c) {
          c.style.display = c.getAttribute('data-heji') === 'true' ? '' : 'none';
        });
      } else {
        cards.forEach(function(c) { c.style.display = ''; });
      }
    }
    function toggleDesc(id) {
      var el = document.getElementById(id);
      if (!el) return;
      var isCollapsed = el.style.webkitLineClamp !== 'unset';
      el.style.webkitLineClamp = isCollapsed ? 'unset' : '3';
      var toggle = el.nextElementSibling;
      if (toggle && toggle.classList.contains('desc-toggle')) {
        toggle.textContent = isCollapsed ? '收起 ∧' : '展开全文 ∨';
      }
    }
    function toggleExtraCards(anchor) {
      var el = document.getElementById('extra-' + anchor);
      if (!el) return;
      var isHidden = el.style.display === 'none' || el.style.display === '';
      el.style.display = isHidden ? '' : 'none';
      var btn = el.parentElement.querySelector('.btn-outline-warning');
      if (btn) {
        btn.textContent = isHidden ? '收起 ∧' : '查看更多';
      }
    }
    </script>
    <script src="../docs/js/main.js"></script>
    <script src="../docs/js/lazy-load.js"></script>
    <script src="../docs/js/global-search.js"></script>
    <script src="../docs/js/add-card-anchors.js"></script>
    <script src="../docs/js/dir-modal.js"></script>
    <script src="../docs/js/protection.min.js" defer></script>
</body>
